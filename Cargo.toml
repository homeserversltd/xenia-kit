[package]
name = "xenia-kit"
version = "0.17.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Typed Coronatio markup and HTTP building blocks for household cartridges"

[features]
default = ["builders"]
markup = ["dep:maud"]
builders = [
    "markup",
    "maud/axum",
    "dep:async-stream",
    "dep:axum",
    "dep:cssparser",
    "dep:futures-core",
    "dep:regex",
    "dep:reqwest",
    "dep:serde",
    "dep:serde_json",
    "dep:tokio",
    "dep:uuid",
]

[dependencies]
axum = { version = "0.8", optional = true }
maud = { version = "0.27", optional = true }
tokio = { version = "1", features = ["net", "fs", "time", "sync", "rt-multi-thread", "macros"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
regex = { version = "1", optional = true }
cssparser = { version = "0.35", optional = true }
async-stream = { version = "0.3", optional = true }
futures-core = { version = "0.3", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
